[build-system]
# see https://github.com/pypa/setuptools-scm/issues/1507
# need setuptools-scm as well to read version from sdist PKG-INFO
requires = ["meson-python>=0.17", "meson>=1.6", "vcs-versioning", "setuptools-scm>=8"]
build-backend = "mesonpy"

[project]
name = "pycxxfilt"
dynamic = ["version"]
description = "Demangle C++ symbols using LLVM's C++ ABI demangler"
requires-python = ">=3.11"
authors = [{name = "Christian Heimes", email = "christian@python.org"}]
license = "Apache-2.0 AND Apache-2.0 WITH LLVM-exception"
license-files = ["LICENSE*"]
readme = "README.md"
keywords = ["demangle", "C++", "LLVM"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: C++",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Software Development :: Libraries",
]

[project.urls]
Homepage = "https://github.com/tiran/pycxxfilt"
Source = "https://github.com/tiran/pycxxfilt"
Issues = "https://github.com/tiran/pycxxfilt/issues"

[project.optional-dependencies]
test = ["pytest"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "ANN"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN001", "ANN201"]

[tool.cibuildwheel]
# Wheel matrix:
#   cp311-*  -> one abi3 wheel, covers every GIL build 3.11+.
#   cp314t-* -> version-specific free-threaded wheel; the free-threaded build
#               has no stable ABI before 3.15, so it cannot be abi3.
# TODO(abi3t): add "cp315t-*" for a cp315-abi3.abi3t wheel once meson-python
# ships PEP 803 support (see _cxxfilt.c).
build = ["cp311-*", "cp314t-*"]
test-requires = "pytest"
test-command = "python -m pytest {project}/tests/ -q --ignore={project}/tests/test_demangle.py"

[[tool.cibuildwheel.overrides]]
# The build defaults to version-specific extensions (see meson.build). Opt the
# shipped stable-ABI wheel back in: cp311 builds on Python 3.11, which still has
# the plain ".abi3.so" suffix, so it produces the cp311-abi3 wheel. cp314t (and
# any other build) stays version-specific and needs no override.
select = "cp311-*"
config-settings = { setup-args = "-Dpython.allow_limited_api=true" }

[tool.cibuildwheel.linux]
archs = ["x86_64", "aarch64", "ppc64le", "s390x"]
skip = ["*-musllinux_*_ppc64le", "*-musllinux_*_s390x"]

[tool.cibuildwheel.macos]
archs = ["x86_64", "arm64"]

[tool.cibuildwheel.windows]
archs = ["AMD64"]

[tool.meson-python]
limited-api = true

[tool.ty.environment]
python-version = "3.11"

[tool.ty.src]
include = ["src/", "tests/"]
