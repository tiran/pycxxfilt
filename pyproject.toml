[build-system]
requires = ["meson-python>=0.17", "meson>=1.6"]
build-backend = "mesonpy"

[project]
name = "pycxxfilt"
version = "0.1.0"
description = "Demangle C++ symbols using LLVM's C++ ABI demangler"
requires-python = ">=3.11"
authors = [{name = "Christian Heimes", email = "christian@python.org"}]
license = "Apache-2.0 AND Apache-2.0 WITH LLVM-exception"
license-files = ["LICENSE*"]
readme = "README.md"
keywords = ["demangle", "C++", "LLVM"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: C++",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Software Development :: Libraries",
]

[project.urls]
Homepage = "https://github.com/tiran/pycxxfilt"
Source = "https://github.com/tiran/pycxxfilt"
Issues = "https://github.com/tiran/pycxxfilt/issues"

[project.optional-dependencies]
test = ["pytest"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "ANN"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN001", "ANN201"]

[tool.cibuildwheel]
# abi3 wheel for stable ABI
build = ["cp311-*"]
test-requires = "pytest"
test-command = "python -m pytest {project}/tests/ -q --ignore={project}/tests/test_demangle.py"

[tool.cibuildwheel.linux]
archs = ["x86_64", "aarch64", "ppc64le", "s390x"]

[tool.cibuildwheel.macos]
archs = ["x86_64", "arm64"]

[tool.cibuildwheel.windows]
archs = ["AMD64"]

[tool.ty.environment]
python-version = "3.11"

[tool.ty.src]
include = ["src/", "tests/"]
