# SPDX-License-Identifier: Apache-2.0
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-package:
    name: Build & verify package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: hynek/build-and-inspect-python-package@67230f7b8410ae0052b39c1efc89d89fff43ff10  # v3.0.2
        with:
          include-free-threaded: 'false'

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
      - run: uvx ruff check src/ tests/
      - run: uvx ruff format --check src/ tests/
      - run: clang-format --dry-run --Werror src/pycxxfilt/_cxxfilt.c

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
      - run: uvx ty check src/

  test-linux:
    runs-on: ubuntu-latest
    # The demangler compile is Python-independent, so every job shares one
    # ccache prefix and reuses the object across the whole matrix.
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_NOHASHDIR: "1"
      CCACHE_COMPILERCHECK: content
    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-ci-linux-${{ matrix.python-version }}-${{ github.run_id }}
          restore-keys: ccache-ci-linux-
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true
      - name: Install ccache
        run: sudo apt-get install -y ccache
      - name: Build and install
        run: uv pip install --system ".[test]"
      - name: ccache stats
        if: always()
        continue-on-error: true
        run: ccache -s
      - name: Run tests
        run: python -m pytest tests/ -q

  test-freethreaded:
    runs-on: ubuntu-latest
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_NOHASHDIR: "1"
      CCACHE_COMPILERCHECK: content
    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.14t", "3.15t"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-ci-linux-${{ matrix.python-version }}-${{ github.run_id }}
          restore-keys: ccache-ci-linux-
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true
      - name: Install ccache
        run: sudo apt-get install -y ccache
      - name: Build and install
        run: uv pip install --system ".[test]"
      - name: ccache stats
        if: always()
        continue-on-error: true
        run: ccache -s
      - name: Run tests
        run: python -m pytest tests/ -q

  test-linux-qemu:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        arch: [ppc64le, s390x]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1  # v4.4.0
        with:
          platforms: linux/${{ matrix.arch }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-ci-qemu-${{ matrix.arch }}-${{ github.run_id }}
          restore-keys: ccache-ci-qemu-${{ matrix.arch }}-
      - uses: pypa/cibuildwheel@b9e566a2b284570af229f6c2a33673410d0389a3  # v4.3.4
        env:
          CIBW_ARCHS_LINUX: ${{ matrix.arch }}
          CIBW_BUILD: cp314-manylinux*
          CIBW_TEST_COMMAND: python -m pytest {project}/tests/ -q --ignore={project}/tests/test_demangle.py
          CIBW_BEFORE_ALL: yum install -y ccache || apk add --no-cache ccache
          CIBW_ENVIRONMENT: >-
            CCACHE_DIR=/host${{ github.workspace }}/.ccache
            CCACHE_NOHASHDIR=1
            CCACHE_COMPILERCHECK=content
      - name: ccache stats
        # ccache ran inside the emulated container; read its host-mounted dir.
        if: always()
        continue-on-error: true
        run: |
          sudo apt-get install -y ccache
          CCACHE_DIR=${{ github.workspace }}/.ccache ccache -s

  test-macos:
    runs-on: macos-latest
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_NOHASHDIR: "1"
      CCACHE_COMPILERCHECK: content
    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-ci-macos-${{ matrix.python-version }}-${{ github.run_id }}
          restore-keys: ccache-ci-macos-
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install ccache
        run: brew install ccache
      - name: Build and install
        run: uv pip install --system ".[test]"
      - name: ccache stats
        if: always()
        continue-on-error: true
        run: ccache -s
      - name: Run tests
        run: python -m pytest tests/ -q

  test-windows:
    runs-on: windows-latest
    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756  # v1.13.0
      - name: Build and install
        run: uv pip install --system ".[test]"
      - name: Run tests
        run: python -m pytest tests/ -q
