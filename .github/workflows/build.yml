# SPDX-License-Identifier: Apache-2.0
name: Build & Publish

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sdist:
    name: Build sdist
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          enable-cache: false
      - name: Build sdist
        run: uv build --sdist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: sdist
          path: dist/*.tar.gz

  wheels-linux:
    name: Build Linux wheels (${{ matrix.arch }})
    needs: sdist
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # x86_64 and aarch64 build on native runners; ppc64le and s390x have
          # no native runners and fall back to (slow) QEMU emulation.
          - arch: x86_64
            runs-on: ubuntu-latest
          - arch: aarch64
            runs-on: ubuntu-24.04-arm
          - arch: ppc64le
            runs-on: ubuntu-latest
            qemu: true
          - arch: s390x
            runs-on: ubuntu-latest
            qemu: true
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: sdist
          path: dist
      - name: Resolve sdist path
        id: sdist
        run: echo "path=$(ls dist/*.tar.gz)" >> "$GITHUB_OUTPUT"
        shell: bash
      - name: Set up QEMU
        if: matrix.qemu
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8  # v4.2.0
        with:
          platforms: linux/${{ matrix.arch }}
      - name: Restore ccache
        # Skip on tags so release wheels build from a clean cache.
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-linux-${{ matrix.arch }}-${{ github.run_id }}
          restore-keys: ccache-linux-${{ matrix.arch }}-
      - uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          package-dir: ${{ steps.sdist.outputs.path }}
        env:
          CIBW_ARCHS_LINUX: ${{ matrix.arch }}
          # ccache lives in the build container; cibuildwheel mounts the host at
          # /host, so point CCACHE_DIR at the cached workspace dir. meson picks up
          # ccache automatically once it is on PATH.
          CIBW_BEFORE_ALL: yum install -y ccache || apk add --no-cache ccache
          CIBW_ENVIRONMENT: >-
            CCACHE_DIR=/host${{ github.workspace }}/.ccache
            CCACHE_NOHASHDIR=1
            CCACHE_COMPILERCHECK=content
      - name: ccache stats
        if: always()
        run: CCACHE_DIR=${{ github.workspace }}/.ccache ccache -s
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: wheels-linux-${{ matrix.arch }}
          path: wheelhouse/*.whl

  wheels-macos:
    name: Build macOS wheels (${{ matrix.arch }})
    needs: sdist
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, arm64]
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: sdist
          path: dist
      - name: Resolve sdist path
        id: sdist
        run: echo "path=$(ls dist/*.tar.gz)" >> "$GITHUB_OUTPUT"
        shell: bash
      - name: Restore ccache
        # Skip on tags so release wheels build from a clean cache.
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-macos-${{ matrix.arch }}-${{ github.run_id }}
          restore-keys: ccache-macos-${{ matrix.arch }}-
      - uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          package-dir: ${{ steps.sdist.outputs.path }}
        env:
          CIBW_ARCHS_MACOS: ${{ matrix.arch }}
          CIBW_ENVIRONMENT: >-
            CCACHE_DIR=${{ github.workspace }}/.ccache
            CCACHE_NOHASHDIR=1
            CCACHE_COMPILERCHECK=content
      - name: ccache stats
        if: always()
        run: CCACHE_DIR=${{ github.workspace }}/.ccache ccache -s
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: wheels-macos-${{ matrix.arch }}
          path: wheelhouse/*.whl

  wheels-windows:
    name: Build Windows wheels
    needs: sdist
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: sdist
          path: dist
      - name: Resolve sdist path
        id: sdist
        run: echo "path=$(ls dist/*.tar.gz)" >> "$GITHUB_OUTPUT"
        shell: bash
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756  # v1.13.0
      - uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          package-dir: ${{ steps.sdist.outputs.path }}
        env:
          CIBW_ARCHS_WINDOWS: AMD64
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: wheels-windows-AMD64
          path: wheelhouse/*.whl

  verify-wheels:
    name: Verify wheel ABI tags
    needs: [wheels-linux, wheels-macos, wheels-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          path: wheelhouse
          pattern: wheels-*
          merge-multiple: true
      - name: Assert wheels carry the expected ABI tags
        run: python3 .github/check-wheel-tags.py wheelhouse/*.whl

  publish:
    name: Publish to PyPI
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [sdist, wheels-linux, wheels-macos, wheels-windows, verify-wheels]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      attestations: write
      contents: read
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          path: dist
          merge-multiple: true
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
        with:
          attestations: true
