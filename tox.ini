# SPDX-License-Identifier: Apache-2.0
[tox]
requires =
    tox>=4
    tox-uv
env_list =
    py{311,312,313,314}
    lint
    typecheck
skip_missing_interpreters = true

[testenv]
deps = pytest
commands =
    python -m pytest {posargs:tests/ -q}

[testenv:lint]
skip_install = true
deps = ruff
allowlist_externals = clang-format
commands =
    ruff check {posargs:src/ tests/}
    ruff format --check {posargs:src/ tests/}
    clang-format --dry-run --Werror src/pycxxfilt/_cxxfilt.c

[testenv:fix]
skip_install = true
deps = ruff
allowlist_externals = clang-format
commands =
    ruff check --fix {posargs:src/ tests/}
    ruff format {posargs:src/ tests/}
    clang-format -i src/pycxxfilt/_cxxfilt.c

[testenv:typecheck]
skip_install = true
deps = ty
commands =
    ty check {posargs:src/}
